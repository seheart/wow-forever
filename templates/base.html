<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Seth's WoW Forever Planner{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;text y='.9em' font-size='90'&gt;🗡️&lt;/text&gt;&lt;/svg&gt;">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script>
  (function () {
    var saved = localStorage.getItem('theme');
    if (!saved || saved === 'dark') document.documentElement.dataset.theme = 'dark';
  })();
</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<nav aria-label="Main">
  <a class="brand" href="{{ url_for('dashboard') }}">
    <span class="owner">Seth's</span>WOW FOREVER<span class="kind">Planner</span>
  </a>
  <div class="brand-tag">Nov 4, 2026 · {{ ruleset }}</div>

  <div class="nav-label">Board</div>
  <a class="nav-item {{ 'active' if active=='dashboard' }}" href="{{ url_for('dashboard') }}">Dashboard</a>
  <a class="nav-item {{ 'active' if active=='toons' }}" href="{{ url_for('toons') }}">My Toons</a>

  <div class="nav-foot">
    <button class="theme-toggle" id="theme-toggle" type="button"></button>
  </div>
</nav>

<main id="main">
  {% block content %}{% endblock %}
</main>

<script>
  (function () {
    // theme
    var btn = document.getElementById('theme-toggle');
    function label() {
      btn.textContent = document.documentElement.dataset.theme === 'dark' ? 'Light' : 'Dark';
    }
    btn.addEventListener('click', function () {
      var dark = document.documentElement.dataset.theme !== 'dark';
      if (dark) document.documentElement.dataset.theme = 'dark';
      else delete document.documentElement.dataset.theme;
      localStorage.setItem('theme', dark ? 'dark' : 'light');
      label();
    });
    label();

  })();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
